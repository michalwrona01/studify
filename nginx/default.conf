# HTTP origin for Cloudflare Flexible -> Mikrus -> nginx.
# Enable Always Use HTTPS at Cloudflare; do not redirect origin HTTP (redirect loop).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name as.wronamichal.online;

    if ($deny_ai) { return 403; }
    if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host as.wronamichal.online;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Canonical public scheme; never trust a client-supplied forwarding header.
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Forwarded "";
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Referrer-Policy;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 30s;
    proxy_redirect off;
    proxy_cache off;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Importer uses http://studify-backend:8080 inside Docker, never this public proxy.
    # Prefix also covers trailing slashes; authorization cannot be bypassed by redirect.
    location ^~ /api/schedules { return 404; }
    location ~ ^/(docs|redoc|openapi\.json)(/|$) { return 404; }
    location ~ /\. { return 404; }

    location = /login {
        limit_req zone=login burst=5 nodelay;
        # Global safety ceiling, intentionally shared across users behind the proxy.
        limit_req zone=login_total burst=20 nodelay;
        proxy_pass http://studify-backend:8080;
    }
    location = /api/plan_zajec_lekarski_as.ics {
        # Error diagnostics can embed this URL's secret token. Use the structured access log instead.
        error_log /dev/null;
        limit_except GET { deny all; }
        proxy_pass http://studify-backend:8080;
    }
    location / {
        limit_req zone=web burst=40 nodelay;
        proxy_pass http://studify-backend:8080;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name new-vision.wronamichal.online;
    root /var/www/newvision;
    index index.html;
    charset utf-8;
    access_log /var/log/nginx/new-vision.access.log detailed;

    if ($deny_ai) { return 403; }
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    limit_req zone=web burst=60 nodelay;

    # Allow conventional search indexing; opt out of AI crawlers/training.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: GPTBot\nUser-agent: OAI-SearchBot\nUser-agent: ChatGPT-User\nUser-agent: ClaudeBot\nUser-agent: Claude-User\nUser-agent: Claude-SearchBot\nUser-agent: anthropic-ai\nUser-agent: CCBot\nUser-agent: Google-Extended\nUser-agent: Bytespider\nUser-agent: Amazonbot\nUser-agent: FacebookBot\nUser-agent: meta-externalagent\nUser-agent: PerplexityBot\nUser-agent: Perplexity-User\nUser-agent: cohere-ai\nDisallow: /\n\nUser-agent: *\nAllow: /\n";
    }
    # Before asset regex: deny /.git/logo.png as well as ordinary dotfiles.
    location ~ /\. { return 404; }
    location ~* \.(bak|old|orig|sql|sqlite3?|log|env|ya?ml|toml|ini|conf|sh|pem|key)$ { return 404; }
    location / { try_files $uri $uri/ =404; }
    location ~* \.(css|js|svg|png|jpe?g|webp|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
    }
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;
}
