services:
  studify-nginx:
    container_name: studify-nginx
    restart: always
    build: .
    ports:
      - "80:80"
      - "100.101.102.103:443:443"
    networks:
      - mikrus-net
    volumes:
      - ./html/poradnik:/var/www/poradnik
      - ../certs:/etc/certs

networks:
  mikrus-net:
    external: true