services:
  studify-nginx:
    container_name: studify-nginx
    restart: always
    build: .
    ports:
      - "80:80"
    networks:
      - mikrus-net
    volumes:
      - ./html/poradnik:/var/www/poradnik
      - ./html/newvision:/var/www/newvision
      - ./certs:/etc/certs

networks:
  mikrus-net:
    external: true