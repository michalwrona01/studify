user nginx;
worker_processes auto;
# Error-level request diagnostics may contain query-string credentials.
error_log /var/log/nginx/error.log crit;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    autoindex off;

    # JSON Lines. URI/query, Referer and received forwarding/geo headers are intentional.
    # Never log Cookie, Authorization or request bodies. Received headers are untrusted.
    log_format detailed escape=json
        '{"time":"$time_iso8601","timestamp":"$msec","request_id":"$request_id",'
        '"host":"$host","http_host":"$http_host","server_name":"$server_name",'
        '"ip":"$remote_addr","peer_ip":"$realip_remote_addr","remote_port":"$remote_port",'
        '"xff":"$http_x_forwarded_for","x_real_ip":"$http_x_real_ip",'
        '"cf_connecting_ip":"$http_cf_connecting_ip","cf_connecting_ipv6":"$http_cf_connecting_ipv6",'
        '"cf_ray":"$http_cf_ray","cf_visitor":"$http_cf_visitor",'
        '"method":"$request_method","uri":"$request_uri","path":"$uri","query":"$args",'
        '"protocol":"$server_protocol","origin_scheme":"$scheme",'
        '"forwarded_proto":"$http_x_forwarded_proto","forwarded_host":"$http_x_forwarded_host",'
        '"user_agent":"$http_user_agent","referer":"$http_referer","origin":"$http_origin",'
        '"accept":"$http_accept","accept_language":"$http_accept_language",'
        '"accept_encoding":"$http_accept_encoding","request_content_type":"$http_content_type",'
        '"fetch_site":"$http_sec_fetch_site","fetch_mode":"$http_sec_fetch_mode",'
        '"status":$status,"bytes":$body_bytes_sent,"bytes_sent":$bytes_sent,'
        '"request_length":$request_length,"seconds":$request_time,'
        '"request_completion":"$request_completion","connection":"$connection",'
        '"connection_requests":$connection_requests,"pipelined":"$pipe",'
        '"limit_req_status":"$limit_req_status","ai_crawler":"$ai_crawler",'
        '"response_content_type":"$sent_http_content_type","gzip_ratio":"$gzip_ratio",'
        '"upstream":{"address":"$upstream_addr","status":"$upstream_status",'
        '"connect_seconds":"$upstream_connect_time","header_seconds":"$upstream_header_time",'
        '"response_seconds":"$upstream_response_time","bytes_received":"$upstream_bytes_received",'
        '"bytes_sent":"$upstream_bytes_sent","cache_status":"$upstream_cache_status"},'
        '"geo":{"source":"cloudflare_headers_unverified","country":"$http_cf_ipcountry",'
        '"continent":"$http_cf_ipcontinent","city":"$http_cf_ipcity",'
        '"region":"$http_cf_region","region_code":"$http_cf_region_code",'
        '"postal_code":"$http_cf_postal_code","latitude":"$http_cf_iplatitude",'
        '"longitude":"$http_cf_iplongitude","timezone":"$http_cf_timezone"}}';
    access_log /var/log/nginx/access.log detailed;

    sendfile on;
    keepalive_timeout 20;
    keepalive_requests 500;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;
    client_max_body_size 64k;
    reset_timedout_connection on;

    # Only directly observed IPs are trusted. Configure real_ip ONLY for known upstream proxies.
    # Per-client limits remain disabled until the real client IP is restored safely.
    # After configuring trusted real_ip proxies, change default to 1 here.
    map $host $client_ip_verified { default 0; }
    map "$client_ip_verified:$request_method" $login_key {
        default "";
        "1:POST" $binary_remote_addr;
    }
    map $request_method $login_total_key {
        default "";
        POST $server_name;
    }
    limit_req_zone $login_key zone=login:10m rate=10r/m;
    limit_req_zone $login_total_key zone=login_total:1m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=web:10m rate=10r/s;
    limit_req_status 429;
    limit_req_log_level notice;

    map $host $robots_tag {
        default "";
        as.wronamichal.online "noindex, nofollow, noarchive, nosnippet";
    }
    map $http_user_agent $ai_crawler {
        default 0;
        ~*(GPTBot|OAI-SearchBot|ChatGPT-User|ClaudeBot|Claude-User|Claude-SearchBot|anthropic-ai|CCBot|Google-Extended|Bytespider|Amazonbot|FacebookBot|meta-externalagent|PerplexityBot|Perplexity-User|cohere-ai) 1;
    }
    map $uri $deny_ai {
        default $ai_crawler;
        /robots.txt 0;
    }

    # Inherited by all servers/locations; do not override add_header in child blocks.
    # Public HTTPS ends at Cloudflare; origin HTTP is intentional in Flexible mode.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Request-ID $request_id always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Robots-Tag $robots_tag always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    include /etc/nginx/conf.d/*.conf;
}
