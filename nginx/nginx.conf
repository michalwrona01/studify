user nginx;
worker_processes auto;
# Error-level request diagnostics may contain query-string credentials.
error_log /var/log/nginx/error.log crit;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    autoindex off;

    # Never log query strings, Referer, cookies or forwarded client-controlled headers.
    log_format safe escape=json '{"ip":"$remote_addr","method":"$request_method",'
        '"path":"$uri","status":$status,"bytes":$body_bytes_sent,"seconds":$request_time}';
    access_log /var/log/nginx/access.log safe;

    sendfile on;
    keepalive_timeout 20;
    keepalive_requests 500;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;
    client_max_body_size 64k;
    reset_timedout_connection on;

    # Only directly observed IPs are trusted. Configure real_ip ONLY for known upstream proxies.
    # Per-client limits remain disabled until the real client IP is restored safely.
    # After configuring trusted real_ip proxies, change default to 1 here.
    map $host $client_ip_verified { default 0; }
    map "$client_ip_verified:$request_method" $login_key {
        default "";
        "1:POST" $binary_remote_addr;
    }
    map $request_method $login_total_key {
        default "";
        POST $server_name;
    }
    limit_req_zone $login_key zone=login:10m rate=10r/m;
    limit_req_zone $login_total_key zone=login_total:1m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=web:10m rate=10r/s;
    limit_req_status 429;
    limit_req_log_level notice;

    map $host $robots_tag {
        default "";
        as.wronamichal.online "noindex, nofollow, noarchive, nosnippet";
    }
    map $http_user_agent $ai_crawler {
        default 0;
        ~*(GPTBot|OAI-SearchBot|ChatGPT-User|ClaudeBot|Claude-User|Claude-SearchBot|anthropic-ai|CCBot|Google-Extended|Bytespider|Amazonbot|FacebookBot|meta-externalagent|PerplexityBot|Perplexity-User|cohere-ai) 1;
    }
    map $uri $deny_ai {
        default $ai_crawler;
        /robots.txt 0;
    }

    # Inherited by all servers/locations; do not override add_header in child blocks.
    # Public HTTPS ends at Cloudflare; origin HTTP is intentional in Flexible mode.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header X-Robots-Tag $robots_tag always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    include /etc/nginx/conf.d/*.conf;
}
